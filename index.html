<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Apoio para Clientes Internos</title>
</head>
<body>
    <img src="gestao_de_parcerias_logo.png" alt="Logo Gestão de Parcerias" width="200">
    <h1>Bem-vindo ao Portal de Apoio</h1>
    <p>Preencha o teste abaixo para enviar uma mensagem:</p>

    <form action="https://formsubmit.co/rafael.barqueiro@g.globo" method="POST">
        <p>
            <label>Seu Nome:</label><br>
            <input type="text" name="nome" required>
        </p>
        <p>
            <label>Mensagem:</label><br>
            <textarea name="mensagem" rows="4" cols="40" required></textarea>
        </p>
        <button type="submit">Enviar Teste</button>
    </form>
</body>
</html>
